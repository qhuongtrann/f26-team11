<!DOCTYPE html>
<html lang="en">
  <head>
    <title>ErrandRunner - Post an Errand</title>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="format-detection" content="telephone=no">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="../customer/organic-1.0.0/css/vendor.css">
    <link rel="stylesheet" type="text/css" href="../customer/organic-1.0.0/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
  </head>

  <body>

    <!-- Header -->
    <header>
      <div class="container-fluid">
        <div class="row py-3 border-bottom">
          <div class="col-sm-4 col-lg-2 text-center text-sm-start d-flex gap-3 justify-content-center justify-content-md-start">
            <div class="d-flex align-items-center my-3 my-sm-0">
              <a href="index.html" class="text-decoration-none">
                <h2 class="text-primary fw-bold mb-0">ErrandRunner</h2>
              </a>
            </div>
          </div>

          <div class="col-lg-6 offset-lg-4">
            <ul class="navbar-nav list-unstyled d-flex flex-row gap-3 gap-lg-4 justify-content-center justify-content-lg-end flex-wrap align-items-center mb-0 fw-bold text-uppercase text-dark px-lg-3">
              <li class="nav-item">
                <a href="index.html" class="nav-link">Home</a>
              </li>
              <li class="nav-item active">
                <a href="customer-request.html" class="nav-link text-primary">Post an Errand</a>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Section -->
    <section class="py-5 bg-light">
      <div class="container-lg">
        <div class="row justify-content-center">
          <div class="col-md-6 bg-white p-5 rounded-4 shadow-sm">

            <h2 class="section-title mb-3">Request a Local Errand</h2>
            <p class="text-muted mb-4">Fill out the details below to post an errand for nearby runners to complete.</p>

            <form onsubmit="event.preventDefault(); alert('Errand posted successfully! Redirecting to Home.'); window.location.href='../customer/organic-1.0.0/index.html';">

              <!-- Customer Name -->
              <div class="mb-3">
                <label for="customerName" class="form-label fw-bold">Your Name</label>
                <input type="text" class="form-control" id="customerName" required placeholder="Enter your full name">
              </div>

              <!-- Errand Description -->
              <div class="mb-3">
                <label for="errandDescription" class="form-label fw-bold">Errand Description</label>
                <textarea class="form-control" id="errandDescription" rows="3" required placeholder="Describe the errand you need done"></textarea>
              </div>

              <!-- City -->
              <div class="mb-3">
                <label for="city" class="form-label fw-bold">City</label>
                <input type="text" class="form-control" id="city" required placeholder="e.g. Greensboro, NC">
              </div>

              <!-- Payout -->
              <div class="mb-3">
                <label for="payout" class="form-label fw-bold">Payout Offered ($)</label>
                <input type="number" class="form-control" id="payout" required placeholder="Enter the payout amount">
              </div>

              <!-- Submit -->
              <div class="d-grid mt-4">
                <button type="submit" class="btn btn-primary rounded-1 py-3 text-uppercase">Submit Errand</button>
              </div>

            </form>

          </div>
        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="py-5">
      <div class="container-lg text-center">
        <p class="text-muted mb-0">© 2026 ErrandRunner. All rights reserved.</p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
